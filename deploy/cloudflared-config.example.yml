# Cloudflare Tunnel: mở webhook, MCP, OAuth và health check; chặn UI/Agent.
# Đặt ở C:\Users\<user>\.cloudflared\config.yml (hoặc thêm vào tunnel đang có), rồi:
#   cloudflared tunnel route dns <tên-tunnel> bridge.example.com
#   cloudflared service install   (chạy như dịch vụ Windows)
tunnel: <TUNNEL-ID>
credentials-file: C:\Users\<user>\.cloudflared\<TUNNEL-ID>.json

ingress:
  - hostname: bridge.example.com
    path: ^/tg/webhook$
    service: http://127.0.0.1:8787
  - hostname: bridge.example.com
    path: ^/mcp(/.*)?$
    service: http://127.0.0.1:8787
  - hostname: bridge.example.com
    path: ^/(\.well-known/(oauth-authorization-server|oauth-protected-resource(/mcp)?)|authorize|register|token|revoke|oauth/approve|healthz)$
    service: http://127.0.0.1:8787
  # Mọi đường khác của hostname bridge → 404. Agent (cổng 8788) KHÔNG được trỏ ra ngoài.
  - hostname: bridge.example.com
    service: http_status:404
  - service: http_status:404

# Tuỳ chọn (Cloudflare WAF → Custom rules), siết theo dải IP nguồn:
#   (http.host eq "bridge.example.com" and starts_with(http.request.uri.path, "/mcp")
#      and not ip.src in {160.79.104.0/21 153.61.208.0/20}) → Block   # IP ra của Anthropic (platform.claude.com/docs/en/api/ip-addresses)
#   (http.host eq "bridge.example.com" and http.request.uri.path eq "/tg/webhook"
#      and not ip.src in {149.154.160.0/20 91.108.4.0/22}) → Block      # dải IP của Telegram
